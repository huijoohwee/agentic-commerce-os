name: Production Release Safety Stop

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Candidate mode to evaluate without mutating Production
        required: true
        type: choice
        options: [bootstrap, steady-state]
      candidate_sha:
        description: Exact current protected main commit
        required: true
        type: string

permissions:
  actions: read
  contents: read
  deployments: read

concurrency:
  group: agentic-commerce-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Protected Candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
    steps:
      - name: Validate dispatch contract
        env:
          RELEASE_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_MODE" == bootstrap || "$RELEASE_MODE" == steady-state ]]

      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Run locked implementation checks
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$CANDIDATE_SHA"
          timeout --foreground --kill-after=30s 8m npm ci --ignore-scripts
          timeout --foreground --kill-after=30s 20m npm run check:implementation
          test ! -e .wrangler/deploy/config.json
          test -z "$(git status --porcelain --untracked-files=all)"
          node scripts/production-release/contracts.ts topology \
            wrangler.core.jsonc wrangler.edge.jsonc > /dev/null

  authorized_refusal:
    name: Authorized Production Safety Stop
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      RELEASE_MODE: ${{ inputs.mode }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Build minified non-mutating candidate evidence
        run: |
          set -euo pipefail
          timeout --foreground --kill-after=30s 8m npm ci --ignore-scripts
          evidence="$RUNNER_TEMP/agentic-commerce-production"
          bundles="$RUNNER_TEMP/agentic-commerce-production-bundles"
          mkdir -p "$evidence" "$bundles"
          node scripts/production-release/lifecycle.ts identity \
            "$CANDIDATE_SHA" "$evidence/identity.json"
          for kind in core edge; do
            timeout --foreground --kill-after=30s 8m npx --no-install wrangler deploy \
              -c "wrangler.$kind.jsonc" --env production --dry-run --minify \
              --outdir "$bundles/$kind"
            node scripts/production-release/lifecycle.ts bundle-size "$bundles/$kind" \
              "$evidence/$kind-bundle-proof.json"
          done

      - name: Verify exact first-attempt Production approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/agentic-commerce-production"
          node scripts/production-release/human-authorization.ts fetch "$RELEASE_MODE" \
            "$CANDIDATE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$evidence/human-authorization.json"
          unset GH_TOKEN

      - name: Recheck protected candidate after approval
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$CANDIDATE_SHA"
          test ! -e .wrangler/deploy/config.json
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Refuse before any Production credential or mutation
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/agentic-commerce-production"
          node scripts/production-release/release-authority.ts "$RELEASE_MODE" \
            "$CANDIDATE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$evidence/human-authorization.json" "$evidence/core-bundle-proof.json" \
            "$evidence/edge-bundle-proof.json" "$evidence/release-authority-refusal.json"

      - name: Upload typed safety-stop evidence
        if: ${{ failure() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-safety-stop-${{ inputs.mode }}-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/agentic-commerce-production
          if-no-files-found: warn
          retention-days: 30
