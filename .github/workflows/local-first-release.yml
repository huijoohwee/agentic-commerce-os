name: Local-first Production Release

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact protected main for the selected reviewed checkout profile
        required: true
        type: string
      checkout_mode:
        description: Sandbox, paid-order reader with sales disabled, or live education sales
        required: true
        default: sandbox
        type: choice
        options: [sandbox, live-reader, live]
      live_webhook_id:
        description: Exact existing Commerce live webhook destination ID; required for live profiles
        required: false
        default: ''
        type: string
      live_webhook_provisioning:
        description: Exact nonsecret receipt from the controlled Commerce webhook provisioner
        required: false
        default: ''
        type: string
      live_reader:
        description: For live sales, exact successful reader sourceRevision/versionId/runId/receiptDigest JSON
        required: false
        default: ''
        type: string
      rehearse_rollback:
        description: Required for fulfillment releases; rehearse the retained reader and restore the exact candidate around one actual listing job; no payment
        required: false
        default: true
        type: boolean
      retained_baseline:
        description: Optional exact retained deployment, version, source and failed run IDs for a restored bootstrap
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read
  deployments: read

concurrency:
  group: agentic-commerce-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Local-first Candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      LOCAL_FIRST_CHECKOUT: ${{ inputs.checkout_mode }}
      LOCAL_FIRST_LIVE_WEBHOOK_ID: ${{ inputs.live_webhook_id }}
      LOCAL_FIRST_WEBHOOK_PROVISIONING_JSON: ${{ inputs.live_webhook_provisioning }}
      LOCAL_FIRST_LIVE_READER_JSON: ${{ inputs.live_reader }}
      LOCAL_FIRST_ROLLBACK_REHEARSAL: ${{ inputs.rehearse_rollback }}
      LOCAL_FIRST_RETAINED_BASELINE: ${{ inputs.retained_baseline }}
      LOCAL_FIRST_EVIDENCE_DIR: ${{ github.workspace }}/node_modules/.cache/local-first-verification
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Validate protected source before preparation
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$CANDIDATE_SHA"
      - run: npm ci --ignore-scripts
      - name: Validate the explicit checkout profile and retained reader reference
        id: live-inputs
        run: node scripts/local-first-release/live-profile.mjs preflight
      - name: Download the exact retained paid-order reader receipt
        if: ${{ steps.live-inputs.outputs.reader_run_id != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.live-inputs.outputs.reader_run_id }}
          name: local-first-result-${{ steps.live-inputs.outputs.reader_run_id }}
          path: ${{ env.LOCAL_FIRST_EVIDENCE_DIR }}/retained-live-reader
      - name: Validate the optional retained deployment reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/local-first-release/retained-baseline.mjs
      - run: node_modules/.bin/playwright install --with-deps chromium
      - name: Verify browser, mutation refusal and deployable artifact
        run: |
          npm run typecheck
          npm run check:authored-limits
          npm run check:local-first
          node scripts/local-first-release/artifact.mjs
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: local-first-prepared-${{ github.run_id }}
          path: ${{ env.LOCAL_FIRST_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 90

  release:
    name: Authorized Local-first Production Release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      LOCAL_FIRST_CHECKOUT: ${{ inputs.checkout_mode }}
      LOCAL_FIRST_LIVE_WEBHOOK_ID: ${{ inputs.live_webhook_id }}
      LOCAL_FIRST_WEBHOOK_PROVISIONING_JSON: ${{ inputs.live_webhook_provisioning }}
      LOCAL_FIRST_LIVE_READER_JSON: ${{ inputs.live_reader }}
      LOCAL_FIRST_ROLLBACK_REHEARSAL: ${{ inputs.rehearse_rollback }}
      LOCAL_FIRST_RETAINED_BASELINE: ${{ inputs.retained_baseline }}
      LOCAL_FIRST_EVIDENCE_DIR: ${{ github.workspace }}/node_modules/.cache/local-first-verification
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node_modules/.bin/playwright install --with-deps chromium
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: local-first-prepared-${{ github.run_id }}
          path: ${{ env.LOCAL_FIRST_EVIDENCE_DIR }}
      - name: Verify scoped owner policy and actual run approval
        env:
          GH_TOKEN: ${{ github.token }}
          ROUTE_AUTHORITY: ${{ vars.PRODUCTION_ROUTE_AUTHORITY_JSON }}
        run: |
          set -euo pipefail
          mode=$(node -e 'process.stdout.write(JSON.parse(process.env.ROUTE_AUTHORITY).mode)')
          node scripts/local-first-release/authorization.mjs fetch "$mode" "$CANDIDATE_SHA" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$LOCAL_FIRST_EVIDENCE_DIR/human-authorization.json"
      - name: Deploy sandbox Worker and verify the exact public release
        if: ${{ inputs.checkout_mode != 'live' && inputs.checkout_mode != 'live-reader' }}
        env:
          GH_TOKEN: ${{ github.token }}
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          STRIPE_LIVE_SECRET_KEY: ${{ secrets.STRIPE_LIVE_SECRET_KEY }}
          STRIPE_LIVE_WEBHOOK_SECRET: ${{ secrets.STRIPE_LIVE_WEBHOOK_SECRET }}
          CHECKOUT_RECOVERY_SECRET: ${{ secrets.CHECKOUT_RECOVERY_SECRET }}
          STOREFRONT_SESSION_SECRET: ${{ secrets.STOREFRONT_SESSION_SECRET }}
          LISTING_HOST_BEARER: ${{ secrets.LISTING_HOST_BEARER }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PRODUCTION_ROUTE_AUTHORITY_JSON: ${{ vars.PRODUCTION_ROUTE_AUTHORITY_JSON }}
        run: node scripts/local-first-release/execute.mjs
      - name: Deploy the reviewed checkout profile and verify the exact public release
        if: ${{ inputs.checkout_mode == 'live' || inputs.checkout_mode == 'live-reader' }}
        env:
          GH_TOKEN: ${{ github.token }}
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          STRIPE_LIVE_SECRET_KEY: ${{ secrets.STRIPE_LIVE_SECRET_KEY }}
          STRIPE_LIVE_WEBHOOK_SECRET: ${{ secrets.STRIPE_LIVE_WEBHOOK_SECRET }}
          CHECKOUT_RECOVERY_SECRET: ${{ secrets.CHECKOUT_RECOVERY_SECRET }}
          STOREFRONT_SESSION_SECRET: ${{ secrets.STOREFRONT_SESSION_SECRET }}
          LISTING_HOST_BEARER: ${{ secrets.LISTING_HOST_BEARER }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PRODUCTION_ROUTE_AUTHORITY_JSON: ${{ vars.PRODUCTION_ROUTE_AUTHORITY_JSON }}
        run: node scripts/local-first-release/execute.mjs
      - name: Retain completion or precise failure evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: local-first-result-${{ github.run_id }}
          path: ${{ env.LOCAL_FIRST_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 90
