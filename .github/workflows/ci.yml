name: Integration

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  integration-gate:
    name: Integration Gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Verify public Agentic Base source
        run: git ls-remote https://github.com/huijoohwee/agentic-base.git HEAD

      - name: Install locked dependencies
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          npm ci --ignore-scripts --no-audit --no-fund
          npm rebuild --no-audit --no-fund

      - name: Set up Commerce verification runtime
        uses: ./.github/actions/setup-commerce-runtime

      # Protected source integration is distinct from external task-verdict and
      # deployment authority. Those remain fail-closed under `npm run check`.
      - name: Run protected source Integration Gate
        run: npm run check:integration
