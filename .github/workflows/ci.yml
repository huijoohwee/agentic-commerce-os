name: Integration

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  integration-gate:
    name: Integration Gate
    # Keep rootless teardown stable until actions/runner-images#15182 is deployed.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Enforce shared owner reuse
        uses: huijoohwee/agentic-os/.github/actions/owner-reuse@d2accfda2bbf1f96175267d2ae2bf9be596801c6
        with:
          baseline: 3898af8a485c13c6c323173ee8ca74474b8c5d37

      - name: Qualify registered fleet reuse
        uses: huijoohwee/agentic-os/.github/actions/fleet-reuse@3ed239e9f3591ade6bfb84b5262e2c0487bd7039

      - name: Verify public Agentic Base source
        run: git ls-remote https://github.com/huijoohwee/agentic-base.git HEAD

      - name: Install locked dependencies
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          npm ci --ignore-scripts --no-audit --no-fund
          npm rebuild --no-audit --no-fund

      - name: Verify Gateway guideline sources in the assembled SME pack
        run: node scripts/project-guideline-sources.mjs

      - name: Set up Commerce verification runtime
        uses: ./.github/actions/setup-commerce-runtime

      # Protected source integration is distinct from external task-verdict and
      # deployment authority. Those remain fail-closed under `npm run check`.
      - name: Run protected source Integration Gate
        run: npm run check:integration

      - name: Exercise the registered Geo projection in listings
        run: npm run check:geo
